services:
  - type: web
    name: aura-king-kakao-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ADMIN_IDS
        value: TeamnTo
      - key: AUTH_URL
        sync: false
      - key: DB_PATH
        value: /var/data/aura.sqlite
    disk:
      name: aura-data
      mountPath: /var/data
      sizeGB: 1
